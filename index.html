<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Navigate · Modern Directions</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    
    <style>
        :root {
            --primary: #0066FF;
            --primary-dark: #0052CC;
            --surface: #FFFFFF;
            --surface-secondary: #F5F5F7;
            --text: #1D1D1F;
            --text-secondary: #86868B;
            --border: #E5E5EA;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 20px 40px rgba(0,0,0,0.12);
            --radius-sm: 12px;
            --radius: 16px;
            --radius-lg: 24px;
            --radius-xl: 32px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', Roboto, Oxygen, sans-serif;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            background: var(--surface-secondary);
            color: var(--text);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Header */
        .header {
            background: var(--surface);
            padding: 16px 20px;
            z-index: 1000;
            position: relative;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #0066FF, #00C6FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--surface-secondary);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all var(--transition);
            position: relative;
            overflow: hidden;
        }

        .icon-btn:active {
            transform: scale(0.92);
            background: #E8E8ED;
        }

        /* Search Container */
        .search-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .search-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .search-dots {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            width: 20px;
            flex-shrink: 0;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .dot-start {
            background: #34C759;
            box-shadow: 0 0 0 3px rgba(52, 199, 89, 0.2);
        }

        .dot-end {
            background: #FF3B30;
            box-shadow: 0 0 0 3px rgba(255, 59, 48, 0.2);
        }

        .dot-line {
            width: 2px;
            height: 20px;
            background: #D1D1D6;
            border-radius: 1px;
        }

        .search-input-wrapper {
            flex: 1;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 14px 16px;
            background: var(--surface-secondary);
            border: 2px solid transparent;
            border-radius: var(--radius);
            font-size: 15px;
            font-weight: 400;
            color: var(--text);
            transition: all var(--transition);
            outline: none;
            -webkit-user-select: text;
            user-select: text;
        }

        .search-input:focus {
            background: var(--surface);
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(0, 102, 255, 0.1);
        }

        .search-input::placeholder {
            color: #AEAEB2;
        }

        /* Map Container */
        .map-wrapper {
            flex: 1;
            position: relative;
            background: #E5E5EA;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* Floating Action Buttons */
        .fab-container {
            position: absolute;
            right: 16px;
            bottom: 32px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 999;
        }

        .fab {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            background: var(--surface);
            box-shadow: var(--shadow-lg);
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .fab:active {
            transform: scale(0.9);
            background: #F0F0F5;
        }

        .fab-primary {
            width: 56px;
            height: 56px;
            background: var(--primary);
            color: white;
            font-size: 24px;
            box-shadow: 0 8px 24px rgba(0, 102, 255, 0.35);
        }

        .fab-primary:active {
            background: var(--primary-dark);
        }

        /* Bottom Sheet */
        .bottom-sheet {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--surface);
            border-radius: var(--radius-xl) var(--radius-xl) 0 0;
            box-shadow: var(--shadow-lg);
            z-index: 1000;
            transform: translateY(100%);
            transition: transform 0.5s cubic-bezier(0.32, 0.72, 0, 1);
            max-height: 50vh;
            max-height: 50dvh;
            display: flex;
            flex-direction: column;
            will-change: transform;
        }

        .bottom-sheet.active {
            transform: translateY(0);
        }

        .sheet-handle {
            width: 36px;
            height: 5px;
            background: #D1D1D6;
            border-radius: 3px;
            margin: 12px auto;
            flex-shrink: 0;
        }

        .sheet-content {
            flex: 1;
            overflow-y: auto;
            padding: 0 20px 32px;
            -webkit-overflow-scrolling: touch;
        }

        .route-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .route-meta {
            display: flex;
            gap: 16px;
        }

        .route-stat {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .route-stat-value {
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
        }

        .close-sheet {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: var(--surface-secondary);
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
        }

        .close-sheet:active {
            transform: scale(0.9);
            background: #E8E8ED;
        }

        .step-item {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            padding: 14px 0;
            border-bottom: 1px solid var(--border);
            animation: slideUp 0.3s ease forwards;
            opacity: 0;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .step-icon-wrapper {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            background: var(--surface-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .step-info {
            flex: 1;
            min-width: 0;
        }

        .step-text {
            font-size: 15px;
            font-weight: 500;
            color: var(--text);
            line-height: 1.4;
            margin-bottom: 4px;
        }

        .step-distance {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 400;
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-120px);
            background: var(--text);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            z-index: 2000;
            transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
            pointer-events: none;
            box-shadow: var(--shadow-lg);
        }

        .toast.active {
            transform: translateX(-50%) translateY(0);
        }

        /* Loading Pulse */
        .loading-pulse {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            z-index: 1500;
            display: none;
        }

        .loading-pulse.active {
            display: block;
        }

        .pulse-ring {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(0, 102, 255, 0.2);
            position: absolute;
            animation: pulse 1.5s ease-out infinite;
        }

        .pulse-ring:nth-child(2) {
            animation-delay: 0.5s;
        }

        @keyframes pulse {
            0% {
                transform: scale(0.5);
                opacity: 1;
            }
            100% {
                transform: scale(2);
                opacity: 0;
            }
        }

        /* Override leaflet styles */
        .leaflet-control-attribution {
            display: none !important;
        }

        .leaflet-routing-container {
            display: none !important;
        }

        .leaflet-control-zoom {
            display: none !important;
        }

        .leaflet-marker-icon {
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }

        /* Mobile optimizations */
        @media (max-width: 428px) {
            .header {
                padding: 12px 16px;
            }
            .search-input {
                padding: 12px 14px;
                font-size: 14px;
            }
            .fab-container {
                right: 12px;
                bottom: 24px;
                gap: 10px;
            }
            .fab {
                width: 44px;
                height: 44px;
                font-size: 18px;
            }
            .fab-primary {
                width: 52px;
                height: 52px;
                font-size: 22px;
            }
            .bottom-sheet {
                max-height: 45vh;
                max-height: 45dvh;
            }
        }

        @media (min-width: 768px) {
            .header {
                max-width: 600px;
                margin: 16px auto;
                border-radius: var(--radius-xl);
                box-shadow: var(--shadow-md);
            }
            .map-wrapper {
                border-radius: var(--radius-xl) var(--radius-xl) 0 0;
                overflow: hidden;
                margin: 0 16px;
            }
            .bottom-sheet {
                left: 16px;
                right: 16px;
                border-radius: var(--radius-xl);
                bottom: 16px;
                max-width: 600px;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <div class="logo">Navigate</div>
            <div class="header-actions">
                <button class="icon-btn" id="swapBtn" aria-label="Swap locations">⇅</button>
            </div>
        </div>
        <div class="search-container">
            <div class="search-row">
                <div class="search-dots">
                    <div class="dot dot-start"></div>
                    <div class="dot-line"></div>
                    <div class="dot dot-end"></div>
                </div>
                <div class="search-input-wrapper" style="display: flex; flex-direction: column; gap: 8px; flex: 1;">
                    <input 
                        type="text" 
                        class="search-input" 
                        id="startInput" 
                        placeholder="Current location" 
                        autocomplete="off"
                        enterkeyhint="next"
                    >
                    <input 
                        type="text" 
                        class="search-input" 
                        id="endInput" 
                        placeholder="Where to?" 
                        autocomplete="off"
                        enterkeyhint="go"
                    >
                </div>
            </div>
        </div>
    </div>

    <div class="map-wrapper">
        <div id="map"></div>
        
        <div class="loading-pulse" id="loadingPulse">
            <div class="pulse-ring"></div>
            <div class="pulse-ring"></div>
        </div>

        <div class="fab-container">
            <button class="fab" id="locateBtn" aria-label="My location">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>
                </svg>
            </button>
            <button class="fab fab-primary" id="getDirectionsBtn" aria-label="Get directions">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="3 11 22 2 13 21 11 13 3 11"/>
                </svg>
            </button>
        </div>

        <div class="bottom-sheet" id="bottomSheet">
            <div class="sheet-handle"></div>
            <div class="sheet-content" id="sheetContent"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

    <script>
        (() => {
            // DOM Elements
            const map = L.map('map', {
                zoomControl: false,
                attributionControl: false,
                dragging: true,
                tap: true
            }).setView([40.7128, -74.0060], 14);

            // Map tiles
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                maxZoom: 19
            }).addTo(map);

            // Custom zoom control
            L.control.zoom({ position: 'bottomleft' }).addTo(map);

            const startInput = document.getElementById('startInput');
            const endInput = document.getElementById('endInput');
            const getDirectionsBtn = document.getElementById('getDirectionsBtn');
            const locateBtn = document.getElementById('locateBtn');
            const swapBtn = document.getElementById('swapBtn');
            const bottomSheet = document.getElementById('bottomSheet');
            const sheetContent = document.getElementById('sheetContent');
            const loadingPulse = document.getElementById('loadingPulse');
            const toast = document.getElementById('toast');

            let routingControl = null;
            let startMarker = null;
            let endMarker = null;
            let currentLocation = null;

            // Toast
            const showToast = (message, duration = 3000) => {
                toast.textContent = message;
                toast.classList.add('active');
                clearTimeout(toast._timeout);
                toast._timeout = setTimeout(() => toast.classList.remove('active'), duration);
            };

            // Loading
            const setLoading = (loading) => {
                loadingPulse.classList.toggle('active', loading);
                getDirectionsBtn.style.opacity = loading ? '0.5' : '1';
                getDirectionsBtn.style.pointerEvents = loading ? 'none' : 'auto';
            };

            // Geocode
            const geocode = async (query) => {
                const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=3`;
                const res = await fetch(url, { headers: { 'User-Agent': 'NavigateApp/2.0' } });
                const data = await res.json();
                if (!data.length) throw new Error(`Location not found: ${query}`);
                return data.map(d => ({
                    lat: parseFloat(d.lat),
                    lng: parseFloat(d.lon),
                    name: d.display_name
                }));
            };

            // Reverse geocode
            const reverseGeocode = async (lat, lng) => {
                const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`;
                const res = await fetch(url, { headers: { 'User-Agent': 'NavigateApp/2.0' } });
                const data = await res.json();
                return data.display_name || `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
            };

            // Clear route
            const clearRoute = () => {
                if (routingControl) { map.removeControl(routingControl); routingControl = null; }
                if (startMarker) { map.removeLayer(startMarker); startMarker = null; }
                if (endMarker) { map.removeLayer(endMarker); endMarker = null; }
                bottomSheet.classList.remove('active');
            };

            // Format
            const fmtDist = (m) => m >= 1000 ? `${(m/1000).toFixed(1)} km` : `${Math.round(m)} m`;
            const fmtTime = (s) => {
                const h = Math.floor(s/3600), min = Math.round((s%3600)/60);
                return h ? `${h}h ${min}m` : `${min} min`;
            };

            // Get icon
            const getIcon = (text) => {
                const t = text.toLowerCase();
                if (t.includes('right')) return '↱';
                if (t.includes('left')) return '↰';
                if (t.includes('straight')||t.includes('head')) return '↑';
                if (t.includes('roundabout')) return '🔄';
                if (t.includes('arrive')||t.includes('destination')) return '🎯';
                if (t.includes('merge')) return '🔀';
                if (t.includes('u-turn')) return '↩';
                return '→';
            };

            // Display route
            const displayRoute = (route, startName, endName) => {
                const { summary, instructions } = route;
                const steps = instructions.map((inst, i) => `
                    <div class="step-item" style="animation-delay: ${i * 0.05}s">
                        <div class="step-icon-wrapper">${getIcon(inst.text)}</div>
                        <div class="step-info">
                            <div class="step-text">${inst.text}</div>
                            <div class="step-distance">${fmtDist(inst.distance)}</div>
                        </div>
                    </div>
                `).join('');

                sheetContent.innerHTML = `
                    <div class="route-header">
                        <div class="route-meta">
                            <div class="route-stat">
                                <span>📏</span>
                                <span class="route-stat-value">${fmtDist(summary.totalDistance)}</span>
                            </div>
                            <div class="route-stat">
                                <span>⏱</span>
                                <span class="route-stat-value">${fmtTime(summary.totalTime)}</span>
                            </div>
                        </div>
                        <button class="close-sheet" id="closeSheet">✕</button>
                    </div>
                    <div style="font-size:13px;color:var(--text-secondary);margin-bottom:16px;line-height:1.5;">
                        <strong>${startName.split(',')[0]}</strong> → <strong>${endName.split(',')[0]}</strong>
                    </div>
                    ${steps}
                `;

                bottomSheet.classList.add('active');
                document.getElementById('closeSheet').addEventListener('click', () => bottomSheet.classList.remove('active'));
            };

            // Calculate route
            const calculateRoute = (start, end) => {
                clearRoute();

                startMarker = L.marker([start.lat, start.lng], {
                    icon: L.divIcon({
                        className: '',
                        html: '<div style="width:16px;height:16px;background:#34C759;border:3px solid white;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,0.3);"></div>',
                        iconSize: [16, 16],
                        iconAnchor: [8, 8]
                    })
                }).addTo(map);

                endMarker = L.marker([end.lat, end.lng], {
                    icon: L.divIcon({
                        className: '',
                        html: '<div style="width:16px;height:16px;background:#FF3B30;border:3px solid white;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,0.3);"></div>',
                        iconSize: [16, 16],
                        iconAnchor: [8, 8]
                    })
                }).addTo(map);

                routingControl = L.Routing.control({
                    waypoints: [L.latLng(start.lat, start.lng), L.latLng(end.lat, end.lng)],
                    routeWhileDragging: false,
                    showAlternatives: false,
                    fitSelectedRoutes: true,
                    lineOptions: { styles: [{ color: '#0066FF', weight: 5, opacity: 0.9 }] },
                    createMarker: () => null
                }).addTo(map);

                routingControl.on('routesfound', (e) => {
                    displayRoute(e.routes[0], start.name, end.name);
                    const bounds = L.latLngBounds([
                        [start.lat, start.lng], [end.lat, end.lng]
                    ]);
                    map.fitBounds(bounds, { padding: [80, 80], maxZoom: 16 });
                });

                routingControl.on('routingerror', () => {
                    showToast('No route found between these points');
                });
            };

            // Main action
            const getDirections = async () => {
                const startQ = startInput.value.trim();
                const endQ = endInput.value.trim();

                if (!startQ || !endQ) {
                    showToast('Please enter both locations');
                    return;
                }

                setLoading(true);
                try {
                    const [startRes, endRes] = await Promise.all([geocode(startQ), geocode(endQ)]);
                    const start = startRes[0], end = endRes[0];
                    calculateRoute(start, end);
                } catch (e) {
                    showToast(e.message);
                } finally {
                    setLoading(false);
                }
            };

            // Locate user
            const locateUser = () => {
                if (!navigator.geolocation) {
                    showToast('Geolocation not supported');
                    return;
                }

                setLoading(true);
                navigator.geolocation.getCurrentPosition(
                    async (pos) => {
                        const { latitude, longitude } = pos.coords;
                        currentLocation = { lat: latitude, lng: longitude };
                        map.setView([latitude, longitude], 16);
                        
                        try {
                            const addr = await reverseGeocode(latitude, longitude);
                            startInput.value = addr;
                            showToast('Location found ✓');
                        } catch {
                            startInput.value = `${latitude.toFixed(5)}, ${longitude.toFixed(5)}`;
                        }

                        L.circleMarker([latitude, longitude], {
                            radius: 8,
                            color: '#0066FF',
                            fillColor: '#0066FF',
                            fillOpacity: 0.3,
                            weight: 3
                        }).addTo(map);

                        setLoading(false);
                    },
                    () => {
                        showToast('Location access denied');
                        setLoading(false);
                    },
                    { enableHighAccuracy: true, timeout: 8000, maximumAge: 30000 }
                );
            };

            // Event listeners
            getDirectionsBtn.addEventListener('click', getDirections);
            locateBtn.addEventListener('click', locateUser);
            
            swapBtn.addEventListener('click', () => {
                [startInput.value, endInput.value] = [endInput.value, startInput.value];
                if (routingControl) getDirections();
            });

            endInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') getDirections();
            });

            startInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') endInput.focus();
            });

            // Bottom sheet swipe to close
            let touchStartY = 0;
            bottomSheet.addEventListener('touchstart', (e) => {
                touchStartY = e.touches[0].clientY;
            });

            bottomSheet.addEventListener('touchmove', (e) => {
                const diff = e.touches[0].clientY - touchStartY;
                if (diff > 60 && bottomSheet.scrollTop <= 0) {
                    bottomSheet.classList.remove('active');
                }
            });

            // Initialize
            setTimeout(locateUser, 500);
        })();
